<!doctype html>
<!--
  Certificate design for WCC Launchpad 30.

  One file per event: a new hackathon means a new template here, not a change
  to the renderer. Placeholders are {{NAME}}, {{ROLE}}, {{EVENT}}, {{DATES}},
  {{ID}}, {{VERIFY_URL}} and {{QR}}.

  A4 landscape at 96dpi is 1123x794. The page box is set in millimetres so the
  PDF comes out at true A4 rather than a screenshot that happens to look right.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: A4 landscape; margin: 0; }

  :root {
    --paper: #f3efe5;
    --paper-2: #e8e1d5;
    --ink: #142139;
    --ink-60: rgba(20, 33, 57, 0.62);
    --signal: #ed1c24;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 297mm;
    height: 210mm;
    background: var(--paper);
    color: var(--ink);
    font-family: "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow: hidden;
  }

  /* Printer's rule, not a border: it frames the type without boxing it in. */
  .frame {
    position: absolute;
    inset: 12mm;
    border: 1.2pt solid var(--ink);
  }

  .inner { position: absolute; inset: 22mm 26mm; display: flex; flex-direction: column; }

  .mono {
    font-family: "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 8.5pt;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  header { display: flex; justify-content: space-between; align-items: flex-start; }
  .wordmark { font-weight: 800; font-size: 13pt; letter-spacing: -0.01em; line-height: 1.05; }
  .wordmark span { color: var(--signal); }

  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; }

  .awarded { color: var(--ink-60); }

  /*
    The name is the whole point of the object, so it gets the largest type on
    the page — but registration data contains names four words long, and an
    overflowing name is worse than a smaller one. The renderer measures this
    element and steps the size down until it fits, writing the result into
    --name-size. See scripts/render-certificates.mjs.
  */
  .name {
    font-size: var(--name-size, 46pt);
    font-weight: 800;
    line-height: 1.02;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    margin: 4mm 0 5mm;
    max-width: 100%;
  }

  .citation { font-size: 11.5pt; line-height: 1.55; max-width: 150mm; color: var(--ink-60); }
  .citation strong { color: var(--ink); font-weight: 600; }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 10mm;
    padding-top: 6mm;
    border-top: 0.8pt solid var(--paper-2);
  }

  .meta { display: flex; gap: 14mm; }
  .meta dt { color: var(--ink-60); margin-bottom: 1.5mm; }
  .meta dd { font-size: 10pt; font-weight: 600; }

  .verify { display: flex; align-items: flex-end; gap: 4mm; text-align: right; }
  .verify img { width: 22mm; height: 22mm; display: block; }
  .verify .label { color: var(--ink-60); margin-bottom: 1.5mm; }
  /*
    One line, always. The id is fixed-length, so the whole url has a known
    maximum width — letting it wrap split it mid-word as
    "wecodecoders.in/verif / y/L30-..." which reads as a broken address on the
    one element whose entire job is to be typed in correctly.
  */
  .verify .url { font-size: 8pt; white-space: nowrap; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="inner">
    <header>
      <div class="wordmark">WE<span>CODE</span><br>CODERS</div>
      <div class="mono" style="text-align:right; color: var(--ink-60);">
        {{EVENT}}<br>{{DATES}}
      </div>
    </header>

    <div class="body">
      <p class="mono awarded">This certifies that</p>
      <h1 class="name">{{NAME}}</h1>
      <p class="citation">
        took part in <strong>{{EVENT}}</strong>, a national online hackathon run by
        We Code Coders, and is recognised as <strong>{{ROLE}}</strong>.
      </p>
    </div>

    <footer>
      <dl class="meta">
        <div>
          <dt class="mono">Issued</dt>
          <dd>{{ISSUED}}</dd>
        </div>
        <div>
          <dt class="mono">Certificate ID</dt>
          <dd style="font-family: SFMono-Regular, Menlo, monospace;">{{ID}}</dd>
        </div>
      </dl>

      <div class="verify">
        <div>
          <p class="mono label">Verify at</p>
          <p class="mono url">{{VERIFY_URL}}</p>
        </div>
        <img src="{{QR}}" alt="">
      </div>
    </footer>
  </div>
</body>
</html>
